<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>429 — Too Many Requests</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1e;
            color: #f9fafb;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            gap: 16px;
        }
        h1 { color: #fcd34d; font-size: 72px; }
        p { color: #6b7280; font-size: 16px; }
        a {
            color: #00e5ff;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #00e5ff;
            padding: 8px 20px;
            border-radius: 8px;
            margin-top: 8px;
        }
        a:hover { background: #00e5ff; color: #0a0f1e; }
    </style>
</head>
<body>
    <h1>429</h1>
    <p>Too many requests. Please slow down.</p>
    <a href="/login">Go back</a>
</body>
</html>
