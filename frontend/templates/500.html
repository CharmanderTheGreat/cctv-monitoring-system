<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 — Server Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1e;
            color: #f9fafb;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            gap: 16px;
        }
        h1 { color: #ffa0a0; font-size: 72px; } /* Pwedeng baguhin ang kulay para maging pareho sa 403 mo */
        p { color: #6b7280; font-size: 16px; }
        a {
            color: #00e5ff;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #00e5ff;
            padding: 8px 20px;
            border-radius: 8px;
            margin-top: 8px;
        }
        a:hover { background: #00e5ff; color: #0a0f1e; }
    </style>
</head>
<body>
    <h1>500</h1>
    <p>Internal Server Error.</p>
    <a href="/dashboard">Go to Dashboard</a>
</body>
</html>
